<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>意味別 英単語トレーナー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#111827;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:78px}
header{padding:22px 18px 10px}.muted{color:#667085;font-size:13px}
h1{margin:4px 0 0;font-size:25px}.screen{padding:8px 16px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 4px 16px #1118270a}
.hero{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;border:0}.hero .muted{color:#dbeafe}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:#4f46e5;color:#fff;font-weight:800}.secondary{padding:11px 14px;border:0;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px}.stat strong{display:block;font-size:25px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #e5e7eb;display:flex;justify-content:center;z-index:5}.nav button{background:none;border:0;padding:10px 17px;color:#667085;font-size:11px}.nav b{display:block;font-size:20px}
.big{font-size:40px;font-weight:850}.wordbox{text-align:center;padding:30px 10px}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef2ff;color:#4338ca;font-size:11px;margin:3px}
.answers{display:grid;gap:10px}.answer{background:#fff;border:2px solid #e5e7eb;border-radius:15px;padding:15px;text-align:left;font-weight:700}.answer.correct{border-color:#16a34a;background:#f0fdf4}.answer.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{text-align:center;font-weight:800;padding:13px}.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}.search{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:13px;margin-bottom:10px}
.center{text-align:center}.danger{background:#fef2f2;color:#b91c1c}.small{font-size:12px}
.choicegrid{display:grid;gap:10px}.choice{width:100%;padding:15px;border:2px solid #e5e7eb;border-radius:15px;background:#fff;text-align:left}.choice.selected{border-color:#4f46e5;background:#eef2ff}.choice strong{display:block;margin-bottom:3px}.modecard{cursor:pointer}
</style></head>
<body><div id="app"></div>
<script>
const WORDS=[
["own",["所有する","認める・自分の非を認める","自分自身の・固有の"]],
["address",["住所","取り組む・対処する","演説・呼びかけ"]],
["bear",["耐える・我慢する","運ぶ・持つ","産む","熊"]],
["charge",["請求する・料金","責任・担当","非難する・告発する","充電する"]],
["claim",["主張する","要求する・請求する","主張・要求"]],
["cover",["覆う・覆い","報道する","埋め合わせる","扱う・含む"]],
["draw",["描く","引く・引き出す","引き分け","注意を引く"]],
["figure",["数字・数値","人物","姿・形","計算する・推測する"]],
["hold",["持つ・握る","開催する","維持する・保つ","考えを抱く・信じる"]],
["issue",["問題・論点","発行する","発行物・号","出てくる・生じる"]],
["mean",["意味する","意図する","意地悪な","平均の"]],
["object",["物体・物","目的・目標","反対する"]],
["observe",["観察する","守る・遵守する","述べる・気づく"]],
["offer",["提供する・申し出る","申し出・提案","機会を与える"]],
["operate",["操作する・運転する","手術する","機能する・作動する"]],
["order",["注文する・注文","命令・指示","順序・秩序","命じる"]],
["present",["現在の・現在","提示する・示す","贈り物","出席している"]],
["subject",["話題・主題","科目","対象・被験者","従属させる・受けさせる"]],
["support",["支える","支持する","支援・支持","根拠・証拠"]],
["treat",["扱う・取り扱う","治療する","ごちそう・楽しみ"]],
["turn",["回す・曲がる","順番","変化させる","結果・展開"]],
["account",["口座","説明・記述","考慮する・説明する"]],
["approach",["近づく","取り組み方・方法","接近・接近すること"]],
["apply",["適用する","申し込む","当てはまる"]],
["attend",["出席する","注意を向ける","世話をする"]],
["concern",["関係する","心配させる","関心・心配"]],
["conduct",["行う・実施する","行動・振る舞い","指揮する"]],
["consider",["考慮する","〜とみなす","検討する"]],
["contain",["含む","収容できる","抑える・封じ込める"]],
["direct",["直接の・直接に","指揮する・向ける","方向・指示"]],
["express",["表現する","急行の","表現・言い方"]],
["face",["顔","直面する","表面・面"]],
["fail",["失敗する","〜し損なう","不合格になる"]],
["fit",["適合する・合う","健康な・適した","適合・発作"]],
["matter",["問題・事柄","重要である","物質"]],
["note",["メモ・注記","気づく・注意する","特徴・論調"]],
["produce",["生産する","農産物","引き起こす・生み出す"]],
["project",["計画・事業","投影する","見積もる・予測する"]],
["raise",["上げる・持ち上げる","育てる","調達する・集める","提起する"]],
["reach",["到達する","手を伸ばす","範囲・影響力"]],
["reason",["理由","理性・分別","論理的に考える"]],
["respect",["尊敬する・尊敬","点・事項","〜に関して"]],
["serve",["仕える・役立つ","料理を出す","務める・奉仕する","サーブする"]],
["stand",["立つ","耐える","立場・態度","売店・屋台"]],
["strike",["打つ","ストライキ","突然思いつく・印象を与える","削除する・打ち消す"]],
["value",["価値","重視する","評価する・値をつける"]],
["maintain",["維持する","主張する","整備する"]],
["reserve",["予約する・予約","取っておく・確保する","控え・予備"]],
["yield",["生み出す・産出する","譲る・屈する","産出量・収穫"]]
].map(([word,ms])=>({id:word,word,meanings:ms}));

const KEY="meaning-vocab-progress-v1";
let db=JSON.parse(localStorage.getItem(KEY)||"{}");
let session=null;
function pkey(w,m){return w+"|"+m}
function p(w,m){return db[pkey(w,m)] ||= {seen:0,correct:0,wrong:0,streak:0,interval:0,due:0,testSeen:0,testCorrect:0,testWrong:0}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function level(x){let a=p(x.w.word,x.m);return a.correct>=3&&a.interval>=14?"定着":a.wrong?"苦手":a.seen?"学習中":"未学習"}
function counts(){let a=WORDS.flatMap(w=>w.meanings.map(m=>p(w.word,m))),now=Date.now();return{
new:a.filter(x=>!x.seen).length,due:a.filter(x=>x.seen&&x.due<=now).length,
weak:a.filter(x=>x.wrong&&!(x.correct>=3&&x.interval>=14)).length,
mastered:a.filter(x=>x.correct>=3&&x.interval>=14).length,total:a.length}}
function home(){
let c=counts();
view(`<header><div class="muted">意味別 英単語トレーナー</div><h1>今日、覚える。</h1></header><main class="screen">
<div class="card hero"><div class="muted">覚える → 確認する</div><h2>学習とテストを分けました</h2><p>まず四択で周回して覚え、そのあとテストで本当に覚えているか確認できます。</p><button class="primary" onclick="setup('learn')">学習モードを始める →</button></div>
<div class="card"><b>覚えるための周回</b><p class="muted">四択を見ながら、苦手な意味を優先して何度も練習します。</p><button class="secondary" style="width:100%" onclick="setup('learn')">学習モード</button></div>
<div class="card"><b>本当に覚えたか確認</b><p class="muted">答えを見せずに最後まで解いて、結果だけ確認します。</p><button class="secondary" style="width:100%" onclick="setup('test')">テストモード</button></div>
<div class="grid"><div class="stat"><span class="muted">苦手</span><strong>${c.weak}</strong><small>意味</small></div><div class="stat"><span class="muted">今日の復習</span><strong>${c.due}</strong><small>意味</small></div><div class="stat"><span class="muted">未学習</span><strong>${c.new}</strong><small>意味</small></div><div class="stat"><span class="muted">定着</span><strong>${c.mastered}</strong><small>意味</small></div></div>
<div class="card"><b>すぐできる</b><br><br><div class="grid"><button class="secondary" onclick="setup('learn','weak')">苦手特訓</button><button class="secondary" onclick="setup('learn','due')">復習10問</button></div></div></main>`)
}
function setup(mode,preset='mixed'){
session={mode,source:preset,direction:'random',count:10};
view(`<header class="row"><button class="secondary" onclick="home()">←</button><div><div class="muted">${mode==='learn'?'学習モード':'テストモード'}</div><b>出題設定</b></div></header>
<main class="screen">
<div class="card"><b>出題方向</b><p class="muted">覚えやすい方向を選べます。</p>
<div class="choicegrid">
<button id="dir-ja" class="choice" onclick="chooseDirection('ja')"><strong>🇯🇵 日本語 → 英語</strong><span class="small">日本語の意味を見て、英単語を選ぶ</span></button>
<button id="dir-en" class="choice" onclick="chooseDirection('en')"><strong>🇬🇧 英語 → 日本語</strong><span class="small">英単語を見て、日本語の意味を選ぶ</span></button>
<button id="dir-random" class="choice selected" onclick="chooseDirection('random')"><strong>🔀 ランダム</strong><span class="small">2方向を混ぜて出題</span></button>
</div></div>
<div class="card"><b>${mode==='learn'?'学習モード':'テストモード'}</b>
<p class="muted">${mode==='learn'?'正解・不正解をその場で確認しながら、弱点を優先して周回します。':'答え合わせは最後。途中では正解・不正解を表示しないので、実力確認に使えます。'}</p>
<button class="primary" onclick="beginSession()">この設定で${mode==='learn'?'学習':'テスト'}開始 →</button></div></main>`)
}
function chooseDirection(d){
session.direction=d;
['ja','en','random'].forEach(x=>document.getElementById('dir-'+x)?.classList.toggle('selected',x===d));
}
function beginSession(){
let a=pool(session.source),pick=[];
for(let x of a){if(!pick.some(y=>y.w.word===x.w.word&&y.m===x.m))pick.push(x);if(pick.length===session.count)break}
session.items=pick;session.i=0;session.correct=0;session.answers=[];study();
}
function view(x){document.getElementById("app").innerHTML=`<div class="app">${x}<nav class="nav"><button onclick="home()"><b>⌂</b>ホーム</button><button onclick="start('weak',10)"><b>⚡</b>苦手</button><button onclick="list()"><b>☷</b>単語帳</button><button onclick="stats()"><b>◔</b>記録</button></nav></div>`}
function pool(mode){
let all=WORDS.flatMap(w=>w.meanings.map(m=>({w,m}))),now=Date.now();
if(mode==="weak") all=all.filter(x=>p(x.w.word,x.m).wrong && level(x)!=="定着");
if(mode==="due") all=all.filter(x=>p(x.w.word,x.m).due<=now);
return all.length?all.sort((a,b)=>score(b)-score(a)):WORDS.flatMap(w=>w.meanings.map(m=>({w,m}))).sort((a,b)=>score(b)-score(a));
}
function score(x){
let q=p(x.w.word,x.m),s=Math.random()*3;
if(!q.seen)s+=10;if(q.due<=Date.now())s+=8;if(q.wrong)s+=7;if(q.correct<3)s+=3;
return s;
}
function study(){
let x=session.items[session.i];
let enja=session.direction==='en'||(session.direction==='random'&&Math.random()<.5);
session.q={x,enja,answered:false};
let opts;
if(enja) opts=[x.m,...shuffle(WORDS.flatMap(w=>w.meanings).filter(m=>m!==x.m)).slice(0,3)];
else opts=[x.w,...shuffle(WORDS.filter(w=>w!==x.w)).slice(0,3)];
session.opts=shuffle(opts);
view(`<header class="row"><button class="secondary" onclick="home()">←</button><span class="muted">${session.mode==='learn'?'学習':'テスト'}　${session.i+1} / ${session.items.length}</span></header>
<main class="screen"><div class="bar"><i style="width:${session.i/session.items.length*100}%"></i></div>
<div class="card wordbox"><div class="muted">${enja?"日本語に合う英単語は？":"英単語に合う日本語は？"}</div><div class="big">${enja?x.m:x.w.word}</div></div>
<div class="answers">${session.opts.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${enja?o:o.word}</button>`).join("")}</div>
<div id="feedback"></div></main>`)
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function answer(i){
if(session.q.answered)return;
session.q.answered=true;
let x=session.q.x,correct=session.q.enja?session.opts[i]===x.m:session.opts[i]===x.w;
let q=p(x.w.word,x.m),now=Date.now();
session.answers.push({x,correct});

if(session.mode==='learn'){
document.querySelectorAll(".answer").forEach((b,j)=>{
let ok=session.q.enja?session.opts[j]===x.m:session.opts[j]===x.w;
if(ok)b.classList.add("correct");if(j===i&&!correct)b.classList.add("wrong")
});
if(correct){
session.correct++;q.correct++;q.streak++;
let days=[1,3,7,14,30,60,120][Math.min(q.streak-1,6)];
q.interval=days;q.due=now+days*86400000;
}else{
q.wrong++;q.streak=0;q.interval=.02;q.due=now+12*60000;
}
q.seen++;save();
document.getElementById("feedback").innerHTML=`<div class="feedback" style="color:${correct?"#16a34a":"#dc2626"}">${correct?"正解！":"不正解"}<br><span class="small">${x.w.word} = ${x.m}</span></div><button class="primary" onclick="nextQ()">${session.i+1===session.items.length?"結果を見る":"次へ →"}</button>`;
}else{
q.testSeen++;if(correct){session.correct++;q.testCorrect++}else{q.testWrong++;q.wrong++;q.due=now;q.streak=0}
save();
document.getElementById("feedback").innerHTML=`<div class="feedback">回答を記録しました</div><button class="primary" onclick="nextQ()">${session.i+1===session.items.length?"テスト結果を見る":"次へ →"}</button>`;
}
}
function nextQ(){session.i++;session.i>=session.items.length?result():study()}
function result(){
let r=Math.round(session.correct/session.items.length*100);
let title=session.mode==='learn'?'学習結果':'テスト結果';
let message=session.mode==='learn'
?'間違えた意味は約12分後、正解を重ねた意味は1日→3日→7日…と間隔を広げます。'
:'テスト中は答えを表示せず、結果だけを確認しました。間違えた意味は弱点として学習に戻ります。';
view(`<header><div class="muted">${title}</div><h1>${session.mode==='learn'?'おつかれさま！':'覚えているかチェック'}</h1></header>
<main class="screen"><div class="card center"><div class="big">${r}%</div><p>${session.correct} / ${session.items.length} 正解</p>
<button class="primary" onclick="setup('${session.mode}','${session.source}')">もう一周</button>
<br><br><button class="secondary" onclick="home()">ホームへ</button></div>
<div class="card"><b>次にやるなら</b><p class="muted">${message}</p>
${session.mode==='learn'?'<button class="secondary" onclick="setup(\\'test\\',\\'mixed\\')">このあとテストする →</button>':'<button class="secondary" onclick="setup(\\'learn\\',\\'weak\\')">間違えたところを学習 →</button>'}
</div></main>`)
}
function list(){view(`<header><div class="muted">単語帳</div><h1>意味から探す</h1></header><main class="screen"><input id="search" class="search" placeholder="英単語・日本語で検索" oninput="drawList()"><div id="items"></div></main>`);drawList()}
function drawList(){let q=(document.getElementById("search").value||"").toLowerCase();let a=WORDS.filter(w=>w.word.includes(q)||w.meanings.some(m=>m.includes(q)));document.getElementById("items").innerHTML='<div class="list">'+a.map(w=>`<div class="item"><div class="row"><b>${w.word}</b><span class="tag">${w.meanings.length}意味</span></div><div>${w.meanings.map(m=>`<span class="tag">${m}</span>`).join("")}</div></div>`).join("")+"</div>"}
function stats(){let c=counts();view(`<header><div class="muted">学習記録</div><h1>意味ごとの定着</h1></header><main class="screen"><div class="card"><div class="row"><b>定着率</b><b>${Math.round(c.mastered/c.total*100)}%</b></div><br><div class="bar"><i style="width:${c.mastered/c.total*100}%"></i></div></div><div class="grid"><div class="stat"><span class="muted">総意味</span><strong>${c.total}</strong></div><div class="stat"><span class="muted">定着</span><strong>${c.mastered}</strong></div><div class="stat"><span class="muted">苦手</span><strong>${c.weak}</strong></div><div class="stat"><span class="muted">復習</span><strong>${c.due}</strong></div></div><div class="card"><button class="secondary" onclick="backup()">学習記録をバックアップ</button><br><br><button class="secondary danger" onclick="resetAll()">記録をリセット</button></div></main>`)}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="meaning-vocab-progress.json";a.click()}
function resetAll(){if(confirm("学習記録をすべて消しますか？")){db={};save();stats()}}
home();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
